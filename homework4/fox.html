<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><title>Обыкновенная лисица</title><style>body{font-family:Arial;max-width:700px;margin:30px auto;padding:20px;background:#eef8e8;line-height:1.6}img{width:230px;float:right;margin:0 0 15px 20px}</style></head><body><h1>Обыкновенная лисица</h1><img src="pic05/fox.svg" alt="Лисица"><p>Лисица относится к семейству псовых. Её легко узнать по рыжей шерсти, острой морде и пушистому хвосту.</p><p>Лисы обладают хорошим слухом и могут услышать движение мелкого животного даже под снегом.</p><a href="animals.html">К списку животных</a></body></html>
