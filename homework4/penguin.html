<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><title>Императорский пингвин</title><style>body{font-family:Arial;max-width:700px;margin:30px auto;padding:20px;background:#eef8e8;line-height:1.6}img{width:230px;float:right;margin:0 0 15px 20px}</style></head><body><h1>Императорский пингвин</h1><img src="pic05/penguin.svg" alt="Пингвин"><p>Императорский пингвин — самый крупный из современных пингвинов. Он живёт в Антарктиде и хорошо переносит сильный холод.</p><p>Пингвины не умеют летать, зато отлично плавают и добывают в море рыбу и кальмаров.</p><a href="animals.html">К списку животных</a></body></html>
