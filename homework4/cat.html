<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><title>Домашняя кошка</title><style>body{font-family:Arial;max-width:700px;margin:30px auto;padding:20px;background:#eef8e8;line-height:1.6}img{width:230px;float:right;margin:0 0 15px 20px}</style></head><body><h1>Домашняя кошка</h1><img src="pic05/cat.svg" alt="Кошка"><p>Кошка живёт рядом с человеком уже несколько тысяч лет. Она хорошо видит в сумерках, слышит очень тихие звуки и использует усы для ориентации в пространстве.</p><p>Большую часть суток кошки отдыхают. При хорошем настроении они могут мурлыкать.</p><a href="animals.html">К списку животных</a></body></html>
